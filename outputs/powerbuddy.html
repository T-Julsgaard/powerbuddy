    if(form.id==='planner-form'){const errors={};const date=data['plan-date'];if(!date||date<PB.localDate(state.now))errors['plan-date']='Choose today or a future day.';if(!data.earliest||!data.latest||data.earliest>=data.latest)errors.earliest='Earliest start must be before the latest finish.';const from=PB.parseHour(data.from),to=PB.parseHour(data.to);if(!Number.isFinite(from)||!Number.isFinite(to)||from>=to)errors.from='Choose acceptable hours with the finish after the start.';const duration=+data.duration;if(!Number.isFinite(duration)||duration<.5||duration>6)errors.duration='Choose a duration from 0.5 to 6 hours.';if(Object.keys(errors).length){errorForm(errors);return}const d={appliance:data.appliance,date,duration,earliest:data.earliest,latest:data.latest,from,to};openModal('planner-results',{draft:d,existingId:m.existingId});return}
    if(form.id==='settings-form'){const errors={},map={'electricity-rate':'electricityRate','water-rate':'waterRate','emissions-factor':'emissionsFactor','cycle-energy':'laundryEnergy','shower-flow':'showerLitresPerMinute','standby-power':'standbyWatts'},config={};for(const [input,k]of Object.entries(map)){const v=+data[input],max=k==='waterRate'||k==='standbyWatts'?1000:k==='showerLitresPerMinute'?50:100;if(data[input]===''||!Number.isFinite(v)||v<0||v>max)errors[input]=`Use a value between 0 and ${max}.`;else config[k]=v}const qf=PB.parseHour(data['quiet-from']),qt=PB.parseHour(data['quiet-to']);if(!Number.isFinite(qf)||!Number.isFinite(qt)||qf===qt)errors['quiet-from']='Choose different start and end hours.';if(Object.keys(errors).length){errorForm(errors);return}commit(s=>{s.config=config;s.preferences={prices:!!data['notify-prices'],reminders:!!data['notify-reminders'],readings:!!data['notify-readings'],achievements:!!data['notify-achievements'],quietEnabled:!!data['quiet-enabled'],quietFrom:qf,quietTo:qt,hidePreviews:!!data['hide-previews'],reducedMotion:!!data['reduce-motion']};PB.release(s)},'Settings saved.');closeModal();return}
    if(form.id==='clock-form'){const t=PB.fromLocal(data['simulation-time']);if(!Number.isFinite(t)||data['simulation-time']<'2026-01-01T00:00'||data['simulation-time']>'2030-12-31T23:59'){toast('Choose a valid time between 2026 and 2030.');return}commit(s=>PB.advance(s,t),'Simulation time updated.');closeModal();return}
  });
  document.addEventListener('input',e=>{const input=e.target;if(input.dataset.change==='inspect'){ui.chartIndex=+input.value;if(ui.chartKind==='month'){const r=selected(),months=[];let m=ui.chartAnchor||r.period;for(let i=0;i<6;i++){months.unshift(m);m=PB.prevMonth(m)}const period=months[ui.chartIndex],value=PB.reading(state,period)?.[ui.resource];$('#inspect-value').textContent=PB.shortMonth(period)+' · '+(value===undefined?'Missing':number(value,2)+' '+(ui.resource==='water'?'m³':'kWh'));input.setAttribute('aria-valuetext',$('#inspect-value').textContent);for(const [i,b]of [...$('#content').querySelectorAll('.bar-slot')].entries()){b.classList.toggle('active',i===ui.chartIndex);b.setAttribute('aria-pressed',String(i===ui.chartIndex))}}else{const r=selected(),vals=PB.breakdown(r,ui.resource,ui.chartKind),v=vals[ui.chartIndex]/(ui.chartKind==='hour'?r.days:1);$('#inspect-value').textContent=(ui.chartKind==='day'?ui.chartIndex+1:String(ui.chartIndex).padStart(2,'0')+':00')+' · '+number(v,Math.abs(v)<.1?3:2)+' '+(ui.resource==='water'?'m³':'kWh');input.setAttribute('aria-valuetext',$('#inspect-value').textContent)}}if(input.dataset.change==='price-inspect'){const index=+input.value;ui.modal.priceIndex=index;const price=PB.price(state,PB.fromLocal(ui.modal.draft.date+'T'+String(index).padStart(2,'0')+':00'));$('#price-value').textContent=String(index).padStart(2,'0')+':00 · '+PB.money(price)+' DKK/kWh';input.setAttribute('aria-valuetext',$('#price-value').textContent)}});
  document.addEventListener('change',async e=>{if(e.target.id!=='import-file')return;const file=e.target.files[0];if(!file)return;try{if(file.size>2e6)throw Error('Choose a JSON backup smaller than 2 MB.');ui.pendingImport=PB.validateState(JSON.parse(await file.text()));openModal('import-review')}catch(err){const feedback=$('#import-feedback');if(feedback){feedback.textContent='Backup could not be restored: '+err.message;feedback.className='notice error';feedback.setAttribute('role','alert')}announce('Import failed. Your current data has been preserved.')}});
  $('#presenter-toggle').addEventListener('click',()=>{ui.presenter=!ui.presenter;renderPresenter();if(ui.presenter)$('#presenter').querySelector('button')?.focus()});
  $('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.modal)closeModal();else if(ui.presenter){ui.presenter=false;renderPresenter();$('#presenter-toggle').focus()}return}if(ui.modal&&e.key==='Tab'){const focusables=[...$('#overlay').querySelectorAll('button,input,select,a,summary')].filter(x=>!x.disabled&&x.offsetParent!==null);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
  $('#tabs').addEventListener('animationend',()=>$('#tabs').classList.remove('navigating'));let swipeStart=null;$('#system').addEventListener('pointerdown',e=>{if(state.device==='locked'&&!e.target.closest('button'))swipeStart=e.clientY});$('#system').addEventListener('pointerup',e=>{if(swipeStart!==null&&swipeStart-e.clientY>60&&state.device==='locked')device('app');swipeStart=null});
  $('#system').addEventListener('pointercancel',()=>{swipeStart=null});
  // Exposed read-only snapshot and pure domain functions support reproducible verification.
  window.PowerBuddy={domain:PB,snapshot:()=>PB.clone(state),storage:()=>({...storage}),ui:()=>({tab:ui.tab,period:ui.period,resource:ui.resource,modal:ui.modal?.type})};
  render();
})();
